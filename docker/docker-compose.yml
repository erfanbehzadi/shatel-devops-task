services:
  web:
    build: .
    container_name: web
    ports:
      - "80:80"
    volumes:
      - ../html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:rw
      - ./logs:/var/log/nginx
    networks:
      isolated:
        ipv4_address: 172.20.0.10
    restart: unless-stopped

networks:
  isolated:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
