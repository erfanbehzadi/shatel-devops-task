vrrp_script check_web {
    script "/etc/keepalived/check_web.sh"
    interval 5
    weight -60
}

vrrp_instance VI_1 {
    state MASTER
    interface ens33
    virtual_router_id 51
    priority 150
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass mypass123
    }
    virtual_ipaddress {
        192.168.2.200/24
    }
    track_script {
        check_web
    }
}
